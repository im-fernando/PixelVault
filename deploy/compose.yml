name: pixelvault
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pixelvault
      POSTGRES_DB: pixelvault
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Obrigatória}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pixelvault -d pixelvault']
      interval: 5s
      timeout: 5s
      retries: 12
    mem_limit: 768m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  api:
    image: ${PIXELVAULT_IMAGE:-pixelvault-api}:${PIXELVAULT_RELEASE:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    init: true
    env_file: ../.env
    ports:
      - '127.0.0.1:3400:3333'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3333/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
volumes:
  postgres:
