# Tudo que a aplicação precisa localmente.
#
# MinIO é S3-compatible de propósito: o mesmo código de storage roda aqui e
# no Cloudflare R2 em produção, sem branch por ambiente.

services:
  postgres:
    image: postgres:17-alpine
    container_name: pixelvault-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pixelvault
      POSTGRES_PASSWORD: pixelvault
      POSTGRES_DB: pixelvault
    ports:
      - '5437:5432'
    volumes:
      - pixelvault-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pixelvault -d pixelvault']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: pixelvault-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: pixelvault
      MINIO_ROOT_PASSWORD: pixelvault
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - pixelvault-minio:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  # Cria o bucket na primeira subida e sai. Sem isso, o primeiro upload falha.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 pixelvault pixelvault &&
      mc mb --ignore-existing local/pixelvault-dev &&
      echo 'bucket pixelvault-dev pronto'
      "

volumes:
  pixelvault-postgres:
  pixelvault-minio:
