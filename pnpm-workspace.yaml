packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  '@prisma/engines': set this to true or false
  esbuild: set this to true or false
  prisma: set this to true or false

onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - prisma
  - esbuild
  - msgpackr-extract
  - workerd

# typescript-eslint aceita >=4.8.4 <6.1.0. A TS 7 (compilador nativo) ainda
# nao e suportada pelo ecossistema de lint. Ver docs/adr/0007.
overrides:
  typescript: ^6.0.3
