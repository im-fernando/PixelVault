<!doctype html>
<html lang="pt-BR">
  <meta charset="utf-8" />
  <title>Verificação PS1</title>
  <script type="importmap">
    {
      "imports": {
        "nostalgist": "/emulator/nostalgist/0.22.0/nostalgist.js",
        "@pixelvault/contracts": "/contracts/library/ps1.js"
      }
    }
  </script>
  <body>
    <canvas
      id="canvas"
      width="320"
      height="240"
      style="display: block; width: 320px; height: 240px"
    ></canvas>
    <script type="module">
      import { Ps1EmulatorAdapter, romFromBytes, romFromUrl } from '/runtime/index.js';
      import { criarHomebrewPs1 } from './ps1-homebrew.mjs';
      window.picoAudio = 0;
      window.contextos = [];
      const Original = window.AudioContext;
      window.AudioContext = class extends Original {
        constructor(...args) {
          super(...args);
          window.contextos.push(this);
          const criar = this.createBufferSource.bind(this);
          this.createBufferSource = () => {
            const fonte = criar();
            const start = fonte.start.bind(fonte);
            fonte.start = (...args) => {
              const amostras = fonte.buffer?.getChannelData(0) ?? [];
              for (const v of amostras) window.picoAudio = Math.max(window.picoAudio, Math.abs(v));
              return start(...args);
            };
            return fonte;
          };
        }
      };
      window.abrir = async (url) => {
        window.adapter = new Ps1EmulatorAdapter();
        window.eventos = [];
        adapter.on('error', ({ error }) => eventos.push(error.message));
        adapter.on('fps', (value) => {
          window.fps = value;
        });
        await adapter.mount(document.querySelector('canvas'));
        await adapter.loadGame(
          url ? romFromUrl(url) : romFromBytes(criarHomebrewPs1(), { fileName: 'pixelvault.exe' }),
        );
        await adapter.start();
      };
      window.pronto = true;
    </script>
  </body>
</html>
